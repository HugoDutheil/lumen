#General settings of the experiment
experiment:
  name: "Training"
  weights_filename: "../weights/pcamlp_512.pth"
  weights_classifier: "../weights/autoencoder_weights.pth"
  save_results: True
training: 
  num_samples: 20000
  train_split: 0.8
  val_split: 0.0
  n_epochs: 200
  lr: 0.003
model: 
  type: "pca_mlp" # mlp, cnn, pca_mlp, autoencoder
  hidden_dim: 512
  latent_dim: 144
  n_components: 144
  pca_dim: 160